services:
  postgres:
    image: postgres:16-alpine
    container_name: accufi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      # The public URL: Auth.js builds its redirects and form actions from this, not from the container's own port.
      AUTH_URL: ${APP_URL}
      # How many reverse proxies sit in front of the app (see README, "Deployment"). 0 = none: X-Forwarded-For is ignored.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # The recurring sweep (see README, "Deployment"). Empty means unset: the sweep runs hourly.
      RECURRING_SWEEP: ${RECURRING_SWEEP:-}
      RECURRING_SWEEP_INTERVAL_MS: ${RECURRING_SWEEP_INTERVAL_MS:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
